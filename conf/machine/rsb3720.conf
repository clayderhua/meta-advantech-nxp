#@TYPE: Machine
#@NAME: i.MX8MP
#@DESCRIPTION: A consolidated machine for i.MX 8MP LPDDR4 RSB3720 A2 Board

MACHINEOVERRIDES =. "rsb3720:"

require conf/machine/imx8mpevk.conf

#new
PREFERRED_PROVIDER_virtual/kernel = "linux-imx"

KERNEL_DEVICETREE_BASENAME = "rsb3720"
KERNEL_DEVICETREE:rsb3720 = "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"

SERIAL_CONSOLES = "115200;ttymxc2"
ATF_BOOT_UART_BASE = "0x30880000"

