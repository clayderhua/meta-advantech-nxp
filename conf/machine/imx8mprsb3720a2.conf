MACHINEOVERRIDES =. "imx8mp-lpddr4-evk:"
require conf/machine/imx8mp-lpddr4-evk.conf

PREFERRED_PROVIDER_virtual/kernel = "linux-imx"

KERNEL_DEVICETREE_BASENAME = "imx8mp-rsb3720-a2"
KERNEL_DEVICETREE:imx8mprsb3720a2 = "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"

SERIAL_CONSOLES = "115200;ttymxc2"
ATF_BOOT_UART_BASE = "0x30880000"
UBOOT_DTB_NAME = "imx8mp-evk.dtb"

INHERIT += "cve-check"
UBOOT_DTB_NAME = "imx8mp-evk.dtb"
INHERIT:remove = "create-spdx"
INHERIT += "create-spdx-2.2"
SPDX_GENERATE_PACKAGE = "1"
